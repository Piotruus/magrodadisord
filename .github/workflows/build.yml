name: Build plugin
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build
        run: mvn -B package
        working-directory: DiscordReward
      - uses: actions/upload-artifact@v4
        with:
          name: DiscordReward
          path: DiscordReward/target/DiscordReward-1.0.jar
