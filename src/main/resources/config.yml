# ===== API dla bota Discord =====
api:
  port: 8765
  # Ten sam sekret musi byc w pliku .env bota (PLUGIN_SECRET). ZMIEN GO na dlugi, losowy ciag!
  secret: "ZMIEN_MNIE_NA_DLUGI_LOSOWY_CIAG"

# ===== Warunki =====
required-minutes: 60

# ===== Nagroda (komendy wykonywane z konsoli, {player} = nick) =====
# Dostosuj do swojego pluginu od rang, np. LuckPerms:
reward-commands:
  - "lp user {player} parent addtemp svip 3d"

link: "https://discord.gg/GyNwR5r28"

gui:
  title: "&aNagroda za discorda"
  filler: true
  status-yes: "&a✔"
  status-no: "&c✘"
  lore:
    - ""
    - "&7» &fOdebrana: {status}"
    - "&7» &fNagroda: &6&lꜱᴠɪᴘ &fna &e3dni"
    - ""
    - "&aJak otrzymac nagrode?"
    - " &7• &fWejdz na nasz discord &cdc.firestar.pl"
    - " &7• &fZweryfikuj sie na odpowiednim kanale"
    - " &7• &fNapisz swoj nick na kanale &a#nagroda"
    - ""
    - "&eKliknij, aby otrzymac link do Discorda!"

messages:
  link: "&aKliknij tutaj, aby wejsc na Discorda: &n{link}"
  already-claimed-chat: "&cJuz odebrales nagrode za Discorda!"
  need-time: "&cMusisz spędzić jeszcze {time} na serwerze!"
  success: "&aPomyślnie odebrano nagrodę za Discorda!"
  reset-ok: "&aZresetowano nagrode gracza {player}."
  no-perm: "&cBrak uprawnien."
